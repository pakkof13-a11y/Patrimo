name: CI

on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
    branches: [main, master, develop, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fixtures CI uniquement — jamais de secrets de production (voir docs/secrets.md)
env:
  DATABASE_URL: postgresql://patrimo:patrimo@localhost:5432/patrimo?schema=public
  AUTH_SECRET: ci-only-auth-secret-not-for-production-0123456789abcdef
  AUTH_URL: http://127.0.0.1:3000
  NEXTAUTH_URL: http://127.0.0.1:3000
  ADMIN_PASSWORD: ci-only-admin-password
  DEMO_PASSWORD: ci-only-demo-password
  E2E_USER: demo
  E2E_PASS: ci-only-demo-password
  ALLOW_DEMO_FALLBACK: "true"
  CI: "true"

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Typecheck · Unit · Build
    runs-on: ubuntu-latest
    needs: secrets
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patrimo
          POSTGRES_PASSWORD: patrimo
          POSTGRES_DB: patrimo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patrimo -d patrimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Database migrate + seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Bloquant : deux erreurs (setState-in-effect, prefer-const) sont parties
      # en production pendant que cette étape était en continue-on-error.
      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: quality
    # Mesuré sur le run 79 (PR #25) : la seule étape "Run E2E tests" a duré
    # 28min11s avant d'être annulée par ce timeout — les 394 tests avaient
    # pourtant tous été exécutés (le dernier, watchlist.spec.ts, s'est
    # terminé 3s avant l'annulation). Avec les ~2 min d'installation/seed/
    # build/Chromium qui précèdent dans le même budget, la marge était quasi
    # nulle. 45 min redonne une marge réelle sans dépendre d'un retry pour
    # faire disparaître le dépassement.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patrimo
          POSTGRES_PASSWORD: patrimo
          POSTGRES_DB: patrimo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patrimo -d patrimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + migrate + seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      # Base isolée pour la suite E2E — même service Postgres, base distincte.
      #
      # Sans elle, `e2e/global-setup.ts` seed sur la même base que l'étape
      # précédente : le compte admin, déjà rempli d'un portefeuille complet
      # par le `npm run db:seed` ci-dessus, n'est jamais vidé (le code le
      # documente lui-même : "Seed E2E = wipe compte demo uniquement (admin
      # préservé, donc non vierge)"). Les deux specs de `cockpit.spec.ts` qui
      # décrivent l'écran d'un compte sans données se connectent en admin et
      # échouaient donc à chaque exécution CI, de façon reproductible :
      # `getByTestId('empty-patrimony-cockpit')` introuvable, parce que
      # l'admin avait 115 transactions au lieu de zéro.
      - name: Create isolated e2e database
        run: |
          PGPASSWORD=patrimo psql -h localhost -U patrimo -d patrimo -c "CREATE DATABASE patrimo_e2e;"
          DATABASE_URL="postgresql://patrimo:patrimo@localhost:5432/patrimo_e2e?schema=public" npx prisma migrate deploy

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL_E2E: postgresql://patrimo:patrimo@localhost:5432/patrimo_e2e?schema=public

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
